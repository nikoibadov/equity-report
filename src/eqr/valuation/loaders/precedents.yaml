    revenue_basis: "FY2024"
    growth_pct: 16.3
    premium_pct: null
    value_basis: "Enterprise value"
    note: "Closest business model to SAP SuccessFactors. An aggregator quotes 7.0x trailing revenue and about 24.5x EBITDA."
