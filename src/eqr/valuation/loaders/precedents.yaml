  - target: "Informatica"
    acquirer: "Salesforce"
    announced: "2025-05-27"
    buyer: "Strategic"
    segment: "Data management software"
    ev_usd_bn: 8.0
    revenue_usd_bn: 1.64
    revenue_basis: "FY2024"
    growth_pct: 2.8
    premium_pct: null
