# Precedent transactions: large software deals announced Jan 2022 - Nov 2026 (the same window as the team's Capital IQ screen).
# Hand-collected from public sources because the Capital IQ transaction export (Application Software, 177 rows) is mostly SPAC shells and
# has no implied multiples (EV/revenue, EV/EBITDA all blank; revenue for 3 rows). Each deal lists where its numbers come from.
# Units: USD billions. EV/revenue is calculated by the model as EV / revenue; sources that quote their own multiple are in the note.
as_of: "2026-11-14"
core_growth_max_pct: 20          # core set = target revenue growth known and <= this (SAP grows about 13%)
basis: "Announced deal value / target revenue of the last reported fiscal year or last twelve months before the announcement"
deals:
  - target: "PTC"
    acquirer: "Schneider Electric"
    announced: "2026-10-05"
    buyer: "Strategic"
    segment: "Industrial software (PLM, CAD)"
    ev_usd_bn: 23.7
    revenue_usd_bn: 2.733
    revenue_basis: "LTM to Jun 2026 (Yahoo Finance)"
    growth_pct: 19.2
    premium_pct: 42.3
    value_basis: "Enterprise value"
    note: "PTC is also one of our trading peers. Growth: FY2025 vs FY2024 revenue (Yahoo Finance). Jefferies calls it a decade-low valuation."
    sources:
      - "https://live.euronext.com/en/financial-news/schneider-electric-buy-us-software-firm-ptc-226-billion-deal"
      - "https://www.auganix.org/ar-news-schneider-electric-acquires-ptc/"
