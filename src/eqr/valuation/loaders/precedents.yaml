    ev_usd_bn: 10.7
    revenue_usd_bn: 0.592
    revenue_basis: "FY2022 (Jan 2022)"
    growth_pct: 32.3
    premium_pct: null
    value_basis: "Headline deal value"
    note: "Growth 32% puts it outside the core set."
    sources:
      - "https://www.businesswire.com/news/home/20220320005039/en/Anaplan-to-be-Acquired-by-Thoma-Bravo-for-10.7-Billion"
excluded:
  - {what: "Capital IQ transaction screen (Application Software, Jan 2022 - Nov 2026)", why: "177 rows, mostly SPAC shells; implied EV/revenue and EV/EBITDA are blank for every row and revenue exists for 3 rows"}
  - {what: "Smartsheet / Blackstone and Vista (Sep 2024, $8.4bn)", why: "Sources conflict on enterprise value and revenue (7.1x vs 8.8x)"}
  - {what: "Wiz / Alphabet and CyberArk / Palo Alto (2025)", why: "Security software at hyper-growth multiples above 20x revenue"}
  - {what: "Slack / Salesforce (2020), Cerner / Oracle (Dec 2021)", why: "Announced before January 2022, the start of the window"}
  - {what: "Electronic Arts take-private (2025)", why: "Video games, not enterprise software"}
  - {what: "EBITDA multiples", why: "Not collected: GAAP EBITDA of software targets is small or negative, so revenue is the only multiple that exists for most deals"}
