    revenue_basis: "LTM (S&P Global 451 Research: 9.8x)"
    growth_pct: null
    premium_pct: null
    value_basis: "Enterprise value"
    note: "Growth not collected, so outside the core set. Another analyst uses LTM revenue of $787m (about 10.2x) and quotes 8.4x forward revenue."
